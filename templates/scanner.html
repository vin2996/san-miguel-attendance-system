{% extends "base.html" %}
{% block title %}Scanner - {{ school }}{% endblock %}
{% block page_title %}Scan QR Code{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card p-3 shadow-sm">
      <div class="row g-2 mb-3">
        <div class="col-6">
          <input type="radio" class="btn-check" name="slot" id="btn-mi" value="morning_in" checked>
          <label class="btn btn-outline-success w-100" for="btn-mi"><i class="bi bi-box-arrow-in-right"></i> MORNING IN<br><small>7:15 AM</small></label>
        </div>
        <div class="col-6">
          <input type="radio" class="btn-check" name="slot" id="btn-mo" value="morning_out">
          <label class="btn btn-outline-primary w-100" for="btn-mo"><i class="bi bi-box-arrow-right"></i> MORNING OUT<br><small>12:00 PM</small></label>
        </div>
        <div class="col-6">
          <input type="radio" class="btn-check" name="slot" id="btn-ai" value="afternoon_in">
          <label class="btn btn-outline-warning w-100" for="btn-ai"><i class="bi bi-box-arrow-in-right"></i> AFTERNOON IN<br><small>1:15 PM</small></label>
        </div>
        <div class="col-6">
          <input type="radio" class="btn-check" name="slot" id="btn-ao" value="afternoon_out">
          <label class="btn btn-outline-danger w-100" for="btn-ao"><i class="bi bi-box-arrow-right"></i> AFTERNOON OUT<br><small>4:30 PM</small></label>
        </div>
      </div>
      <div id="reader" style="width:100%; max-width: 400px; margin: 0 auto;"></div>
      <div id="result" class="alert mt-3 d-none"></div>
      <div class="card p-3 mt-3 border-warning">
        <h5><i class="bi bi-keyboard"></i> Manual ID Scan</h5>
        <p class="text-muted small">Type Student ID to scan</p>
        <input type="text" id="manual-id" placeholder="Ex: 001" class="form-control mb-2">
        <button onclick="manualScan()" class="btn btn-warning w-100">Manual SCAN</button>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card p-3 text-center shadow-sm" id="student-info">
      <p class="text-muted">Scan a QR Code to see student info</p>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script>
let canScan = true;
let lastScanTime = 0;

function getSelectedSlot() {
  let el = document.querySelector('input[name="slot"]:checked');
  return el ? el.value : 'morning_in';
}

function getSlotLabel(slot) {
  if (slot === 'morning_in') return 'MORNING IN';
  if (slot === 'morning_out') return 'MORNING OUT';
  if (slot === 'afternoon_in') return 'AFTERNOON IN';
  if (slot === 'afternoon_out') return 'AFTERNOON OUT';
  return slot.toUpperCase();
}

function onScanSuccess(decodedText, decodedResult) {
  if (!canScan) return;
  let now = Date.now();
  if (now - lastScanTime < 5000) return;
  canScan = false;
  lastScanTime = now;
  try { html5QrcodeScanner.pause(true); } catch(e) {}
  let slot = getSelectedSlot();
  sendScan(decodedText, slot);
}

function manualScan(){
  if (!canScan) return;
  let sid = document.getElementById('manual-id').value;
  if(sid == "") {
    alert("Please enter Student ID");
    return;
  }
  canScan = false;
  lastScanTime = Date.now();
  try { html5QrcodeScanner.pause(true); } catch(e) {}
  let slot = getSelectedSlot();
  sendScan(sid, slot);
}

function sendScan(studentId, slot){
  let resultDiv = document.getElementById('result');
  let infoDiv = document.getElementById('student-info');
  resultDiv.classList.add('d-none');
  fetch('/scan', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({student_id: studentId, slot: slot})
  })
  .then(res => res.json())
  .then(data => {
    resultDiv.classList.remove('d-none');
    if(data.status == 'success'){
      resultDiv.className = 'alert alert-success mt-3';
      infoDiv.innerHTML = `
        <h5 class="text-success">${data.name}</h5>
        <p>${data.section}</p>
        <h6>${data.time}</h6>
        <p class="badge bg-primary">${getSlotLabel(slot)}</p>
      `;
    } else {
      resultDiv.className = 'alert alert-danger mt-3';
      infoDiv.innerHTML = `<p class="text-muted">Scan a QR Code to see student info</p>`;
    }
    resultDiv.innerHTML = data.message;
  })
  .catch(err => {
    resultDiv.classList.remove('d-none');
    resultDiv.className = 'alert alert-danger mt-3';
    resultDiv.innerHTML = "Error: " + err;
  })
  .finally(() => {
    setTimeout(() => {
      canScan = true;
      try { html5QrcodeScanner.resume(); } catch(e) {}
    }, 4000);
  });
}

let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
html5QrcodeScanner.render(onScanSuccess);
</script>
{% endblock %}
