<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ school }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(10, 42, 94, 0.85), rgba(13, 110, 253, 0.75)), url("{{ url_for('static', filename='img/bg.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            overflow: hidden;
            position: relative;
        }
        body::before, body::after {
            content: '';
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.25;
            animation: floatBlob 10s ease-in-out infinite;
        }
        body::before {
            background: rgba(255,255,255,0.3);
            top: -120px;
            left: -120px;
        }
        body::after {
            background: rgba(255,193,7,0.25);
            bottom: -120px;
            right: -120px;
            animation-delay: 2.5s;
        }
        @keyframes floatBlob {
            0%,100% { transform: translate(0,0) scale(1); }
            50% { transform: translate(35px,-35px) scale(1.25); }
        }
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            animation: cardEnter 0.8s cubic-bezier(0.4,0,0.2,1);
        }
        @keyframes cardEnter {
            from { opacity:0; transform: translateY(45px) scale(0.94); }
            to { opacity:1; transform: translateY(0) scale(1); }
        }
        .card {
            border-radius: 24px !important;
            overflow: hidden;
            border: none !important;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35) !important;
            backdrop-filter: blur(16px);
            background: rgba(255,255,255,0.97);
        }
        .card-header {
            background: linear-gradient(180deg, #ffffff, #f8f9ff) !important;
            border-bottom: 1px solid rgba(0,0,0,0.06) !important;
            padding: 28px 24px 18px !important;
        }
        .logo-wrap {
            width: 92px;
            height: 92px;
            margin: 0 auto 12px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 22px rgba(0,0,0,0.18);
            border: 3px solid #0a2a5e;
            overflow: hidden;
            padding: 0;
        }
        .logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }
        .school-title {
            font-weight: 800;
            font-size: 20px;
            color: #0a2a5e;
            letter-spacing: -0.4px;
            line-height: 1.2;
        }
        .form-control {
            border-radius: 12px;
            padding: 12px 14px;
            border: 2px solid #e9ecef;
            transition: all 0.25s ease;
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13,110,253,0.15);
            transform: translateY(-1px);
        }
        .btn-primary {
            border-radius: 12px;
            padding: 12px;
            font-weight: 700;
            letter-spacing: 0.4px;
            background: linear-gradient(135deg, #0d6efd, #0a58ca, #42a5f5);
            background-size: 200% 200%;
            animation: gradientMove 3.5s ease infinite;
            border: none;
            box-shadow: 0 8px 20px rgba(13,110,253,0.35);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: all 0.5s ease;
        }
        .btn-primary:hover::before { left: 100%; }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(13,110,253,0.45);
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .alert {
            border-radius: 12px;
            animation: alertIn 0.4s ease;
        }
        @keyframes alertIn {
            from { opacity:0; transform: translateY(-8px); }
            to { opacity:1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-white text-center py-4">
                    <div class="logo-wrap">
                        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="School Logo">
                    </div>
                    <h4 class="school-title mb-0">{{ school }}</h4>
                </div>
                <div class="card-body p-4">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endwith %}
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold"><i class="bi bi-person-fill"></i> Username</label>
                            <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold"><i class="bi bi-lock-fill"></i> Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                        </div>
                        <button class="btn btn-primary w-100 mb-3">
                            <i class="bi bi-box-arrow-in-right"></i> LOGIN
                        </button>
                    </form>
                    <hr style="opacity:0.12;">
                    <p class="text-center mb-0"><small class="text-muted">New Teacher? <a href="{{ url_for('register_user') }}" class="fw-bold text-decoration-none">Register Here</a></small></p>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
