<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - {{ school }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
body { background: linear-gradient(135deg, #0d6efd 0%, #6610f2 100%); }
.register-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.register-card { width: 100%; max-width: 480px; }
</style>
</head>
<body>
<div class="register-wrapper">
<div class="register-card">
<div class="card shadow-lg border-0">
<div class="card-header bg-white text-center py-3">
<h4 class="fw-bold mb-0"><i class="bi bi-person-plus"></i> Register New User</h4>
<p class="text-muted mb-0">Wait for Admin Approval</p>
</div>
<div class="card-body p-4">
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<div class="alert alert-{{ category }} alert-dismissible fade show">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
{% endfor %}
{% endwith %}
<form method="POST">
<div class="mb-3">
<label class="form-label">Full Name</label>
<input type="text" name="full_name" class="form-control" placeholder="Juan Dela Cruz" required>
</div>
<div class="mb-3">
<label class="form-label">Username</label>
<input type="text" name="username" class="form-control" required>
</div>
<div class="mb-3">
<label class="form-label">Password</label>
<input type="password" name="password" class="form-control" required>
</div>
<div class="mb-3">
<label class="form-label">Subject / Grade Handled</label>
<select name="subject" class="form-select" required>
<option value="">-- Select Subject / Grade --</option>
<option value="Kinder">Kinder</option>
<option value="Grade 1">Grade 1</option>
<option value="Grade 2">Grade 2</option>
<option value="Grade 3">Grade 3</option>
<option value="Grade 4">Grade 4</option>
<option value="Grade 5">Grade 5</option>
<option value="Grade 6">Grade 6</option>
<option value="Math">Math</option>
<option value="English">English</option>
<option value="Filipino">Filipino</option>
<option value="Science">Science</option>
<option value="Araling Panlipunan">Araling Panlipunan</option>
<option value="MAPEH">MAPEH</option>
<option value="TLE">TLE</option>
</select>
</div>
<div class="mb-3">
<label class="form-label">Contact Number</label>
<input type="text" name="contact" class="form-control" placeholder="09123456789" required>
</div>
<div class="mb-3">
<label class="form-label">Role</label>
<select name="role" class="form-select">
<option value="Teacher">Teacher</option>
<option value="Admin">Admin</option>
</select>
</div>
<button class="btn btn-success w-100"><i class="bi bi-check-circle"></i> Submit Registration</button>
</form>
<hr>
<p class="text-center mb-0">
<a href="{{ url_for('login') }}"><i class="bi bi-arrow-left"></i> Back to Login</a>
</p>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
