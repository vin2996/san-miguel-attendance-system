<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - {{ school }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
html { height: 100%; }
body {
min-height: 100vh;
height: auto;
display: flex;
align-items: center;
justify-content: center;
background: linear-gradient(270deg, #0d6efd, #1e88e5, #0a58ca, #42a5f5);
background-size: 600% 600%;
animation: bgMove 8s ease infinite;
overflow-y: auto;
overflow-x: hidden;
position: relative;
}
@keyframes bgMove {
0% { background-position: 0% 50%; }
50% { background-position: 100% 50%; }
100% { background-position: 0% 50%; }
}
body::before, body::after {
content: '';
position: fixed;
width: 450px;
height: 450px;
border-radius: 50%;
filter: blur(90px);
opacity: 0.35;
animation: floatBlob 10s ease-in-out infinite;
pointer-events: none;
}
body::before { background: rgba(255,255,255,0.4); top: -120px; left: -120px; }
body::after { background: rgba(255,193,7,0.3); bottom: -120px; right: -120px; animation-delay: 2.5s; }
@keyframes floatBlob {
0%,100% { transform: translate(0,0) scale(1); }
50% { transform: translate(35px,-35px) scale(1.25); }
}
.register-wrapper {
width: 100%;
display: flex;
align-items: center;
justify-content: center;
padding: 12px 20px;
position: relative;
z-index: 1;
}
.register-card {
width: 100%;
max-width: 400px;
animation: cardEnter 0.7s cubic-bezier(0.4,0,0.2,1);
}
@keyframes cardEnter {
from { opacity:0; transform: translateY(30px) scale(0.96); }
to { opacity:1; transform: translateY(0) scale(1); }
}
.card {
border-radius: 20px !important;
overflow: hidden;
border: none !important;
box-shadow: 0 16px 40px rgba(0,0,0,0.28) !important;
backdrop-filter: blur(16px);
background: rgba(255,255,255,0.96);
}
.card-header {
background: linear-gradient(180deg, #ffffff, #f8f9ff) !important;
border-bottom: 1px solid rgba(0,0,0,0.06) !important;
padding: 16px 20px 10px !important;
}
.header-title { font-weight: 800; font-size: 17px; color: #0a2a5e; }
.header-sub { font-size: 11px; color: #6c757d; }
.card-body { padding: 14px 18px !important; }
.form-label { font-size: 12px; margin-bottom: 3px; font-weight: 600; }
.form-control, .form-select {
border-radius: 10px;
padding: 7px 11px;
font-size: 13px;
border: 2px solid #e9ecef;
transition: all 0.2s ease;
}
.form-control:focus, .form-select:focus {
border-color: #0d6efd;
box-shadow: 0 0 0 3px rgba(13,110,253,0.15);
}
.btn-success {
border-radius: 10px;
padding: 9px;
font-size: 13px;
font-weight: 700;
background: linear-gradient(135deg, #198754, #0f5132, #2ecc71);
background-size: 200% 200%;
animation: gradientMove 3.5s ease infinite;
border: none;
box-shadow: 0 6px 16px rgba(25,135,84,0.35);
transition: all 0.3s ease;
position: relative;
overflow: hidden;
}
.btn-success::before {
content: '';
position: absolute;
top: 0;
left: -100%;
width: 100%;
height: 100%;
background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
transition: all 0.5s ease;
}
.btn-success:hover::before { left: 100%; }
.btn-success:hover { transform: translateY(-1px); }
@keyframes gradientMove {
0% { background-position: 0% 50%; }
50% { background-position: 100% 50%; }
100% { background-position: 0% 50%; }
}
.password-wrapper {
position: relative;
}
.password-wrapper .form-control {
padding-right: 38px;
}
.toggle-eye {
position: absolute;
right: 11px;
top: 50%;
transform: translateY(-50%);
cursor: pointer;
color: #6c757d;
font-size: 1.15rem;
z-index: 5;
}
</style>
</head>
<body>
<div class="register-wrapper">
<div class="register-card">
<div class="card shadow-lg border-0">
<div class="card-header text-center">
<div class="header-title"><i class="bi bi-person-plus-fill"></i> Register New User</div>
<div class="header-sub">Wait for Admin Approval</div>
</div>
<div class="card-body">
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<div class="alert alert-{{ category }} alert-dismissible fade show py-2" style="font-size:12px; border-radius:10px;">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
{% endfor %}
{% endwith %}
<form method="POST">
<div class="mb-2">
<label class="form-label"><i class="bi bi-person-badge"></i> Full Name</label>
<input type="text" name="full_name" class="form-control" placeholder="Juan Dela Cruz" required>
</div>
<div class="mb-2">
<label class="form-label"><i class="bi bi-person-fill"></i> Username</label>
<input type="text" name="username" class="form-control" required>
</div>
<div class="mb-2">
<label class="form-label"><i class="bi bi-lock-fill"></i> Password</label>
<div class="password-wrapper">
<input type="password" id="password" name="password" class="form-control" required>
<i class="bi bi-eye-slash toggle-eye" id="togglePassword"></i>
</div>
</div>
<div class="row g-2 mb-2">
<div class="col-4">
<label class="form-label"><i class="bi bi-mortarboard-fill"></i> Grade</label>
<input type="text" class="form-control" value="Grade 6" readonly style="background:#eef2ff; font-weight:700;">
<input type="hidden" name="grade" value="Grade 6">
</div>
<div class="col-8">
<label class="form-label"><i class="bi bi-book-fill"></i> Subject</label>
<select name="subject" class="form-select" required>
<option value="">Select Subject</option>
<option value="Math">Math</option>
<option value="English">English</option>
<option value="Filipino">Filipino</option>
<option value="Science">Science</option>
<option value="Araling Panlipunan">Araling Panlipunan</option>
<option value="MAPEH">MAPEH</option>
<option value="TLE">TLE</option>
<option value="ESP">ESP</option>
</select>
</div>
</div>
<div class="row g-2 mb-2">
<div class="col-7">
<label class="form-label"><i class="bi bi-telephone-fill"></i> Contact Number</label>
<input type="text" name="contact" class="form-control" placeholder="09123456789" required>
</div>
<div class="col-5">
<label class="form-label"><i class="bi bi-shield-lock-fill"></i> Role</label>
<select name="role" class="form-select">
<option value="Teacher">Teacher</option>
<option value="Admin">Admin</option>
</select>
</div>
</div>
<button class="btn btn-success w-100 mt-1"><i class="bi bi-check-circle"></i> Submit Registration</button>
</form>
<hr class="my-2" style="opacity:0.1;">
<p class="text-center mb-0" style="font-size:12px;"><a href="{{ url_for('login') }}" class="fw-bold text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Login</a></p>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('togglePassword').addEventListener('click', function() {
const input = document.getElementById('password');
const isPassword = input.getAttribute('type') === 'password';
input.setAttribute('type', isPassword ? 'text' : 'password');
this.classList.toggle('bi-eye');
this.classList.toggle('bi-eye-slash');
});
</script>
</body>
</html>
